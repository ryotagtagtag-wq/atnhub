<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アテンハブ - 管理者ダッシュボード</title>
  <link rel="stylesheet" href="../shared/style.css">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>アテンハブ</h1>
      <span class="role-badge admin">管理者</span>
    </div>
    <div class="header-right">
      <span id="userInfo"></span>
      <button id="logoutBtn" class="btn btn-secondary">ログアウト</button>
    </div>
  </header>

  <main class="main">
    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="bootstrap">学校登録</button>
      <button class="tab" role="tab" data-tab="classes">クラス管理</button>
      <button class="tab" role="tab" data-tab="teachers">教師管理</button>
      <button class="tab" role="tab" data-tab="students">生徒管理</button>
      <button class="tab" role="tab" data-tab="attendance">出席確認</button>
    </nav>

    <section id="tab-bootstrap" class="tab-panel active">
      <h2>学校登録（初回のみ）</h2>
      <p class="hint">学校が未登録の場合のみ実行してください。学校コードは自動生成されます。</p>
      <form id="bootstrapForm" class="form">
        <div class="form-group">
          <label for="schoolName">学校名 <span class="required">*</span></label>
          <input type="text" id="schoolName" name="schoolName" required placeholder="例: 静岡県立静岡高等学校">
        </div>
        <div class="form-group">
          <label for="adminName">管理者名 <span class="required">*</span></label>
          <input type="text" id="adminName" name="adminName" required placeholder="例: 山田 太郎">
        </div>
        <div class="form-group">
          <label for="adminPin">管理者PIN（6桁） <span class="required">*</span></label>
          <input type="password" id="adminPin" name="adminPin" required minlength="6" maxlength="6" pattern="\d{6}" placeholder="6桁の数字">
        </div>
        <button type="submit" class="btn btn-primary">学校を登録</button>
      </form>
      <div id="bootstrapResult" class="result hidden"></div>
    </section>

    <section id="tab-classes" class="tab-panel hidden">
      <div class="panel-header">
        <h2>クラス管理</h2>
        <button id="addClassBtn" class="btn btn-primary">クラス追加</button>
      </div>
      <div id="classesList" class="list"></div>
    </section>

    <section id="tab-teachers" class="tab-panel hidden">
      <div class="panel-header">
        <h2>教師管理</h2>
        <button id="addTeacherBtn" class="btn btn-primary">教師追加</button>
      </div>
      <div id="teachersList" class="list"></div>
    </section>

    <section id="tab-students" class="tab-panel hidden">
      <div class="panel-header">
        <h2>生徒管理</h2>
        <div class="student-filter">
          <select id="studentClassFilter" class="select">
            <option value="">クラスを選択</option>
          </select>
          <button id="addStudentBtn" class="btn btn-primary" disabled>生徒追加</button>
        </div>
      </div>
      <div id="studentsList" class="list"></div>
    </section>

    <section id="tab-attendance" class="tab-panel hidden">
      <div class="panel-header">
        <h2>出席確認</h2>
        <div class="attendance-filter">
          <select id="attendanceClassFilter" class="select">
            <option value="">クラスを選択</option>
          </select>
          <input type="date" id="attendanceDate" class="date-input" value="">
        </div>
      </div>
      <div id="attendanceList" class="list"></div>
    </section>
  </main>

  <!-- モーダル: クラス追加/編集 -->
  <dialog id="classModal" class="modal">
    <form method="dialog" class="modal-form">
      <h3 id="classModalTitle">クラス追加</h3>
      <input type="hidden" id="classModalId" name="id">
      <div class="form-group">
        <label for="classModalName">クラス名 <span class="required">*</span></label>
        <input type="text" id="classModalName" name="name" required placeholder="例: 1年A組">
      </div>
      <div class="form-group">
        <label for="classModalCode">クラスコード <span class="required">*</span></label>
        <input type="text" id="classModalCode" name="code" required pattern="[A-Z0-9]{4,8}" placeholder="例: 1A2024 (英数字4-8文字)">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="classModalCancel">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- モーダル: 教師追加/編集 -->
  <dialog id="teacherModal" class="modal">
    <form method="dialog" class="modal-form">
      <h3 id="teacherModalTitle">教師追加</h3>
      <input type="hidden" id="teacherModalId" name="id">
      <div class="form-group">
        <label for="teacherModalName">教師名 <span class="required">*</span></label>
        <input type="text" id="teacherModalName" name="name" required placeholder="例: 鈴木 一郎">
      </div>
      <div class="form-group">
        <label for="teacherModalClass">担当クラス <span class="required">*</span></label>
        <select id="teacherModalClass" name="class_id" required>
          <option value="">クラスを選択</option>
        </select>
      </div>
      <div class="form-group">
        <label for="teacherModalPin">PIN（6桁） <span class="required">*</span></label>
        <input type="password" id="teacherModalPin" name="pin" required minlength="6" maxlength="6" pattern="\d{6}" placeholder="6桁の数字">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="teacherModalCancel">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <!-- モーダル: 生徒追加/編集 -->
  <dialog id="studentModal" class="modal">
    <form method="dialog" class="modal-form">
      <h3 id="studentModalTitle">生徒追加</h3>
      <input type="hidden" id="studentModalId" name="id">
      <input type="hidden" id="studentModalClassId" name="class_id">
      <div class="form-group">
        <label for="studentModalName">生徒名 <span class="required">*</span></label>
        <input type="text" id="studentModalName" name="name" required placeholder="例: 田中 花子">
      </div>
      <div class="form-group">
        <label for="studentModalNumber">出席番号 <span class="required">*</span></label>
        <input type="number" id="studentModalNumber" name="number" required min="1" max="99" placeholder="1-99">
      </div>
      <div class="form-group">
        <label for="studentModalPin">PIN（6桁） <span class="required">*</span></label>
        <input type="password" id="studentModalPin" name="pin" required minlength="6" maxlength="6" pattern="\d{6}" placeholder="6桁の数字">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="studentModalCancel">キャンセル</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./admin.js"></script>
</body>
</html>
