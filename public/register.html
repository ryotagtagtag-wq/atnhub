<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 - アテンハブ</title>
  <link rel="stylesheet" href="shared/style.css">
  <style>
    .register-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .register-card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 1rem;
      padding: 2.5rem;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    }
    .register-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .register-header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 0.5rem;
    }
    .register-header p {
      color: #6b7280;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #374151;
    }
    .form-group input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      font-size: 0.9375rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 480px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
    .required { color: #ef4444; }
    .hint {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 0.25rem;
    }
    .btn-register {
      width: 100%;
      padding: 0.875rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    .error-message {
      background: #fee2e2;
      color: #991b1b;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error-message.visible {
      display: block;
    }
    .success-message {
      background: #dcfce7;
      color: #166534;
      padding: 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .success-message.visible {
      display: block;
    }
    .login-link {
      text-align: center;
      margin-top: 1.5rem;
      color: #6b7280;
      font-size: 0.875rem;
    }
    .login-link a {
      color: #2563eb;
      font-weight: 500;
      text-decoration: none;
    }
    .login-link a:hover {
      text-decoration: underline;
    }
    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      color: #1e40af;
    }
    .info-box strong {
      display: block;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h1>アテンハブ</h1>
        <p>学校登録（初回セットアップ）</p>
      </div>

      <div class="info-box">
        <strong>📋 このフォームについて</strong>
        学校で最初にアテンハブを導入する方（管理者）が実行してください。<br>
        学校コードは自動生成され、登録完了後に表示されます。このコードを教職員・生徒に共有してログインしてもらいます。
      </div>

      <div id="errorMessage" class="error-message"></div>
      <div id="successMessage" class="success-message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="schoolName">学校名 <span class="required">*</span></label>
          <input type="text" id="schoolName" name="schoolName" required placeholder="例: 静岡県立静岡高等学校">
        </div>

        <div class="form-group">
          <label for="adminLoginId">管理者ログインID <span class="required">*</span></label>
          <input type="text" id="adminLoginId" name="adminLoginId" required placeholder="例: admin01" pattern="[a-zA-Z0-9_\-]{3,20}">
          <p class="hint">英数字・ハイフン・アンダースコア 3-20文字</p>
        </div>

        <div class="form-group">
          <label for="adminName">管理者名 <span class="required">*</span></label>
          <input type="text" id="adminName" name="adminName" required placeholder="例: 山田 太郎">
        </div>

        <div class="form-group">
          <label for="adminPin">管理者PIN（6桁） <span class="required">*</span></label>
          <input type="password" id="adminPin" name="adminPin" required minlength="6" maxlength="6" pattern="\d{6}" placeholder="6桁の数字" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="adminPinConfirm">PIN確認（6桁） <span class="required">*</span></label>
          <input type="password" id="adminPinConfirm" name="adminPinConfirm" required minlength="6" maxlength="6" pattern="\d{6}" placeholder="確認用に再入力" autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-register">学校を登録して開始</button>
      </form>

      <div class="login-link">
        すでに学校登録済みですか？ <a href="login.html">ログインする</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { api } from './shared/api.js';

    const form = document.getElementById('registerForm');
    const errorEl = document.getElementById('errorMessage');
    const successEl = document.getElementById('successMessage');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.classList.add('visible');
      successEl.classList.remove('visible');
    }

    function showSuccess(message) {
      successEl.textContent = message;
      successEl.classList.add('visible');
      errorEl.classList.remove('visible');
    }

    function hideMessages() {
      errorEl.classList.remove('visible');
      successEl.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const formData = new FormData(form);
      const schoolName = formData.get('schoolName').trim();
      const adminLoginId = formData.get('adminLoginId').trim();
      const adminName = formData.get('adminName').trim();
      const adminPin = formData.get('adminPin');
      const adminPinConfirm = formData.get('adminPinConfirm');

      // バリデーション
      if (!schoolName || !adminLoginId || !adminName || !adminPin || !adminPinConfirm) {
        showError('すべての項目を入力してください');
        return;
      }

      if (adminPin !== adminPinConfirm) {
        showError('PINが一致しません');
        return;
      }

      if (!/^\d{6}$/.test(adminPin)) {
        showError('PINは6桁の数字で入力してください');
        return;
      }

      if (!/^[a-zA-Z0-9_-]{3,20}$/.test(adminLoginId)) {
        showError('ログインIDは英数字・ハイフン・アンダースコア 3-20文字で入力してください');
        return;
      }

      // slug生成（学校名から自動生成、日本語対応）
      let slug = schoolName.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      if (!slug) {
        // 日本語のみ等でslugが空になる場合はタイムスタンプベースで生成
        slug = 'school-' + Date.now().toString(36);
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = '登録中...';

      try {
        const result = await api.bootstrap({
          name: schoolName,
          slug: slug,
          admin_login_id: adminLoginId,
          admin_pin: adminPin,
          admin_name: adminName
        });

        const schoolCode = result.school.code;
        showSuccess(`学校登録完了！<br><strong>学校コード: ${schoolCode}</strong><br>このコードを教職員・生徒に共有してください。<br><br><a href="login.html" style="color:#166534; text-decoration:underline;">ログインページへ進む</a>`);
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = '学校を登録して開始';

      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '学校を登録して開始';
      }
    });

    // 既にログイン済みならリダイレクト
    const token = api.getToken();
    if (token) {
      try {
        const me = await api.me();
        if (me.role === 'student') location.href = '/student/';
        else if (me.role === 'teacher') location.href = '/teacher/';
        else if (me.role === 'school_admin') location.href = '/admin/';
      } catch (e) {
        api.clearToken();
      }
    }
  </script>
</body>
</html>
