name = "atnhub-api"
main = "src/index.js"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

# D1 データベースバインディング
# `wrangler d1 create atnhub` で作成後の database_id をここに記入
[[d1_databases]]
binding = "DB"
database_name = "atnhub"
database_id = "6de7d6b1-ded4-4471-8bd2-d242c6980f5d"  # 作成後に記入

# 環境変数（本番用は wrangler secret put で設定）
[vars]
ENVIRONMENT = "production"
FRONTEND_ORIGIN = "https://atnhub.ryopc.org"
